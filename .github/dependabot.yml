# Dependabot: one batched PR per ecosystem per directory, once a month.
# Minor/patch PRs that pass the Build workflow are auto-merged (see workflows/build.yml).
# Major version bumps arrive as their own PRs and wait for a human.
# Add the "hold" label to any Dependabot PR to stop it from auto-merging.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/"]
    schedule:
      interval: monthly
    labels: [dependencies, javascript]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
